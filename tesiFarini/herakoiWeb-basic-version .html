<!DOCTYPE html>
<html>
<head>
  <title>MediaPipe JS + Geometric Sonification (Mani Originali)</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <style>
    body { margin: 0; background: black; font-family: sans-serif; display: flex; flex-direction: row; justify-content: center; align-items: flex-start; gap: 20px; padding: 20px; }
    #container { display: flex; flex-direction: row; gap: 20px; }
    .panel { position: relative; width: 640px; height: 480px; }
    canvas, video { position: absolute; top: 0; left: 0; width: 640px; height: 480px; }
    video { transform: scaleX(-1); } 
    #output_canvas { transform: scaleX(-1); } 
    
    .controls { position: absolute; top: 10px; right: 10px; z-index: 3; background: rgba(255,255,255,0.7); padding: 10px; border-radius: 5px; }
    
    #btnNext {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 10;
      padding: 12px 20px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    #btnNext:active { transform: translateY(2px); }
  </style>
</head>
<body>
  <div id="container">
    <div class="panel">
      <canvas id="imageCanvas"></canvas>
      <canvas id="imageOverlay" style="z-index:2;"></canvas>
      <button id="btnNext">PROSSIMO LIVELLO ➔</button>
      <div class="controls">
        <label>Frequency Range:</label><br>
        <input type="range" id="min-freq" min="100" max="500" value="200" step="10"> <span id="min-freq-value">200</span> Hz<br>
        <input type="range" id="max-freq" min="500" max="2000" value="700" step="10"> <span id="max-freq-value">700</span> Hz
        <br><br>
        <label>Volume Range:</label><br>
        <input type="range" id="min-vol" min="0.00" max="0.30" value="0.00" step="0.01"> <span id="min-vol-value">0.00</span><br>
        <input type="range" id="max-vol" min="0.30" max="1.00" value="0.30" step="0.01"> <span id="max-vol-value">1.00</span>
      </div>
    </div>
    <div class="panel">
      <video id="input_video" playsinline muted autoplay></video>
      <canvas id="output_canvas"></canvas>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const imgCanvas = document.getElementById('imageCanvas');
    const imgCtx = imgCanvas.getContext('2d');
    const overlayCanvas = document.getElementById('imageOverlay');
    const overlayCtx = overlayCanvas.getContext('2d');
    
    // Sliders
    const minFreqSlider = document.getElementById('min-freq');
    const maxFreqSlider = document.getElementById('max-freq');
    const minFreqValue = document.getElementById('min-freq-value');
    const maxFreqValue = document.getElementById('max-freq-value');
    const minVolSlider = document.getElementById('min-vol');
    const maxVolSlider = document.getElementById('max-vol');
    const minVolValue = document.getElementById('min-vol-value');
    const maxVolValue = document.getElementById('max-vol-value');

    let minFreq = 200, maxFreq = 700, minVol = 0.00, maxVol = 0.30;

    minFreqSlider.addEventListener('input', function() { minFreq = parseInt(this.value); minFreqValue.textContent = minFreq; });
    maxFreqSlider.addEventListener('input', function() { maxFreq = parseInt(this.value); maxFreqValue.textContent = maxFreq; });
    minVolSlider.addEventListener('input', function() { minVol = parseFloat(this.value); minVolValue.textContent = minVol.toFixed(2); });
    maxVolSlider.addEventListener('input', function() { maxVol = parseFloat(this.value); maxVolValue.textContent = maxVol.toFixed(2); });

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let oscillator = null, gainNode = null, grayscaleData = null;

    const lineWidthNera = 60, lineWidthColori = 64, colorBlockLength = 60;

    const levels = [
      function l1() {
        fillRect("white", 0, 0, 640, 480);
        const p1 = [50, 240], p2 = [590, 240];
        drawTrace("black", lineWidthNera, [p1, p2]);
        fillRect("red", p1[0] - colorBlockLength, p1[1] - lineWidthColori/2, colorBlockLength, lineWidthColori);
        fillRect("green", p2[0], p2[1] - lineWidthColori/2, colorBlockLength, lineWidthColori);
      },
      function l2() {
        fillRect("white", 0, 0, 640, 480);
        const pStart = [50, 240], pEnd = [590, 240];
        drawTrace("black", lineWidthNera, [pStart, [200, 240], [200, 100], [440, 100], [440, 240], pEnd]);
        fillRect("red", pStart[0] - colorBlockLength, pStart[1] - lineWidthColori/2, colorBlockLength, lineWidthColori);
        fillRect("green", pEnd[0], pEnd[1] - lineWidthColori/2, colorBlockLength, lineWidthColori);
      },
      function l3() {
        fillRect("white", 0, 0, 640, 480);
        const pStart = [50, 380], pEnd = [590, 260];
        drawTrace("black", 50, [pStart, [180, 380], [180, 260], [310, 260], [310, 140], [440, 140], [440, 260], pEnd]);
        fillRect("red", pStart[0] - colorBlockLength, pStart[1] - 54/2, colorBlockLength, 54);
        fillRect("green", pEnd[0], pEnd[1] - 54/2, colorBlockLength, 54);
      },
      function l4() {
        fillRect("white", 0, 0, 640, 480);
        const pStart = [50, 240], pEnd = [590, 240];
        drawTrace("black", 40, [pStart, [150, 240], [150, 100], [250, 100], [250, 240], [390, 240], [390, 100], [490, 100], [490, 240], pEnd]);
        fillRect("red", pStart[0] - colorBlockLength, pStart[1] - 44/2, colorBlockLength, 44);
        fillRect("green", pEnd[0], pEnd[1] - 44/2, colorBlockLength, 44);
      },
      function l5() {
        fillRect("white", 0, 0, 640, 480);
        const pStart = [100, 100], pEnd = [540, 380];
        drawTrace("black", 30, [pStart, [540, 100], [540, 240], [220, 240], [220, 380], pEnd]);
        fillRect("red", pStart[0] - colorBlockLength, pStart[1] - 34/2, colorBlockLength, 34);
        fillRect("green", pEnd[0], pEnd[1] - 34/2, colorBlockLength, 34);
      }
    ];

    function fillRect(color, x, y, w, h) { imgCtx.fillStyle = color; imgCtx.fillRect(x, y, w, h); }
    function drawTrace(color, lineWidth, points) {
      if (points.length < 2) return;
      imgCtx.strokeStyle = color; imgCtx.lineWidth = lineWidth;
      imgCtx.lineCap = "square"; imgCtx.lineJoin = "miter";
      imgCtx.beginPath(); imgCtx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) imgCtx.lineTo(points[i][0], points[i][1]);
      imgCtx.stroke();
    }

    let currentLevel = 0;
    function loadLevel(index) {
      currentLevel = index;
      imgCtx.clearRect(0, 0, 640, 480);
      levels[currentLevel]();
      grayscaleData = imgCtx.getImageData(0, 0, 640, 480);
      const data = grayscaleData.data;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i]/255, g = data[i+1]/255, b = data[i+2]/255;
        const cmax = Math.max(r, g, b), delta = cmax - Math.min(r, g, b);
        let h = 0;
        if (delta !== 0) {
          if (cmax === r) h = 60 * (((g - b) / delta) % 6);
          else if (cmax === g) h = 60 * ((b - r) / delta + 2);
          else h = 60 * ((r - g) / delta + 4);
        }
        if (h < 0) h += 360;
        data[i] = Math.round((h/360)*255);
        data[i+1] = Math.round(((cmax === 0) ? 0 : delta/cmax)*255);
        data[i+2] = Math.round(cmax*255);
      }
      document.getElementById('btnNext').innerText = `PROSSIMO LIVELLO (${currentLevel + 1}/${levels.length}) ➔`;
    }

    function playFrequency(freq, volume = 0.5) {
      if (!oscillator) {
        oscillator = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
      }
      gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
      oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
    }

    function stopFrequency() {
      if (oscillator) {
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        setTimeout(() => { if(oscillator){oscillator.stop(); oscillator.disconnect(); oscillator = null; gainNode = null;} }, 100);
      }
    }

    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

    hands.onResults(results => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, 640, 480);
      canvasCtx.drawImage(results.image, 0, 0, 640, 480);
      overlayCtx.clearRect(0, 0, 640, 480);

      let handDetected = false;
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handDetected = true;
        for (const handLms of results.multiHandLandmarks) {
          drawConnectors(canvasCtx, handLms, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
          drawLandmarks(canvasCtx, handLms, {color: '#FF0000', lineWidth: 1});
          
          const mirroredHandLms = handLms.map(l => ({ x: 1 - l.x, y: l.y, z: l.z }));
          drawConnectors(overlayCtx, mirroredHandLms, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
          drawLandmarks(overlayCtx, mirroredHandLms, {color: '#FF0000', lineWidth: 1});

          const x = mirroredHandLms[8].x * 640, y = mirroredHandLms[8].y * 480;
          overlayCtx.strokeStyle = 'lime'; overlayCtx.lineWidth = 2;
          overlayCtx.strokeRect(x - 10, y - 10, 20, 20);

          if (grayscaleData) {
            const px = Math.floor(x), py = Math.floor(y);
            if (px >= 0 && px < 640 && py >= 0 && py < 480) {
              const i = (py * 640 + px) * 4;
              const h = grayscaleData.data[i], s = grayscaleData.data[i+1], v = grayscaleData.data[i+2];

              const isBlack = v < 60;
              const isWhite = v > 180 && s < 60;
              const isRed = v > 70 && s > 100 && (h < 25 || h > 230);
              const isGreen = v > 70 && s > 100 && (h > 60 && h < 110);

              let statusText = "";
              if (isRed) { playFrequency(880, 0.3); statusText = "START"; }
              else if (isGreen) { playFrequency(1200, 0.4); statusText = "FINISH!"; }
              else if (isBlack) { playFrequency(440, 0.2); statusText = "ROAD"; }
              else if (isWhite) { playFrequency(150, 0.15); statusText = "OUT"; }
              else { stopFrequency(); }

              if (statusText !== "") {
                overlayCtx.fillStyle = 'white'; overlayCtx.fillRect(x + 10, y - 30, 80, 20);
                overlayCtx.fillStyle = 'black'; overlayCtx.font = 'bold 12px sans-serif';
                overlayCtx.fillText(statusText, x + 15, y - 15);
              }
            }
          }
        }
      }
      if (!handDetected) stopFrequency();
      canvasCtx.restore();
    });

    const camera = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 640, height: 480 });
    document.getElementById('btnNext').addEventListener('click', () => { loadLevel((currentLevel + 1) % levels.length); });
    [canvasElement, imgCanvas, overlayCanvas].forEach(c => { c.width = 640; c.height = 480; });
    camera.start();
    loadLevel(0);
    window.addEventListener('resize', setupCanvasSizes);
  </script>
</body>
</html>
